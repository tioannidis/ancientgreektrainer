<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c36a"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#a88030"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d8"/>
      <stop offset="100%" stop-color="#c8b8a0"/>
    </linearGradient>
    <linearGradient id="colShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8caba"/>
      <stop offset="100%" stop-color="#b8a890"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle radial glow behind column -->
  <circle cx="256" cy="280" r="160" fill="rgba(212,168,83,0.06)"/>

  <!-- === Column Base (Stylobat) === -->
  <rect x="136" y="400" width="240" height="16" rx="3" fill="url(#col)"/>
  <rect x="148" y="388" width="216" height="14" rx="2" fill="url(#colShade)"/>

  <!-- === Column Shaft === -->
  <!-- Main shaft -->
  <rect x="196" y="180" width="120" height="210" rx="2" fill="url(#col)"/>
  <!-- Fluting (grooves) -->
  <rect x="208" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="224" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="240" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="256" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="272" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="288" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <rect x="304" y="182" width="3" height="206" rx="1" fill="rgba(0,0,0,0.08)"/>
  <!-- Entasis (slight bulge) highlight -->
  <rect x="196" y="260" width="120" height="40" rx="2" fill="rgba(255,255,255,0.04)"/>

  <!-- === Capital (Ionisches Kapitell) === -->
  <!-- Abacus -->
  <rect x="180" y="158" width="152" height="12" rx="2" fill="url(#col)"/>
  <!-- Echinus -->
  <rect x="186" y="168" width="140" height="14" rx="7" fill="url(#colShade)"/>
  <!-- Volutes (scrolls) -->
  <circle cx="186" cy="175" r="11" fill="none" stroke="url(#col)" stroke-width="4"/>
  <circle cx="186" cy="175" r="5" fill="url(#colShade)"/>
  <circle cx="326" cy="175" r="11" fill="none" stroke="url(#col)" stroke-width="4"/>
  <circle cx="326" cy="175" r="5" fill="url(#colShade)"/>

  <!-- === Architrave (Epistyl) above === -->
  <rect x="128" y="140" width="256" height="20" rx="3" fill="url(#col)"/>

  <!-- === Omega Symbol === -->
  <text x="256" y="118" text-anchor="middle"
        font-family="'Noto Serif', 'Times New Roman', serif"
        font-size="88" font-weight="700"
        fill="url(#gold)" filter="url(#glow)">Ω</text>

  <!-- Decorative dots flanking Omega -->
  <circle cx="178" cy="98" r="4" fill="#a88030" opacity="0.6"/>
  <circle cx="334" cy="98" r="4" fill="#a88030" opacity="0.6"/>

  <!-- === Small decorative Greek key pattern at bottom === -->
  <g fill="none" stroke="#a88030" stroke-width="2" opacity="0.3">
    <polyline points="166,430 166,440 176,440 176,432 186,432 186,440 196,440 196,430"/>
    <polyline points="316,430 316,440 326,440 326,432 336,432 336,440 346,440 346,430"/>
  </g>

  <!-- Corner accents -->
  <path d="M40,80 L40,50 Q40,40 50,40 L80,40" fill="none" stroke="#a88030" stroke-width="2.5" opacity="0.25"/>
  <path d="M432,40 L462,40 Q472,40 472,50 L472,80" fill="none" stroke="#a88030" stroke-width="2.5" opacity="0.25"/>
  <path d="M40,432 L40,462 Q40,472 50,472 L80,472" fill="none" stroke="#a88030" stroke-width="2.5" opacity="0.25"/>
  <path d="M432,472 L462,472 Q472,472 472,462 L472,432" fill="none" stroke="#a88030" stroke-width="2.5" opacity="0.25"/>
</svg>
